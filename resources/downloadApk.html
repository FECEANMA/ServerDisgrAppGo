<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descargar App - Disgrafía</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #6EC6FF, #B3E5FC);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 90%;
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      color: #1976D2;
      margin-bottom: 10px;
      font-size: 26px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .download-btn {
      background: #1976D2;
      color: white;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      background: #0D47A1;
      transform: scale(1.05);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">✏️📱</div>
    <h1>Aplicación de Apoyo para Disgrafía</h1>
    <p>
      Mejora la escritura y fortalece habilidades motoras
      con ejercicios interactivos diseñados para niños.
    </p>

    <a href="/resources/disgrapp.apk" class="download-btn">
      Descargar APK
    </a>

    <footer>
      Compatible con dispositivos Android
    </footer>
  </div>

</body>
</html>
